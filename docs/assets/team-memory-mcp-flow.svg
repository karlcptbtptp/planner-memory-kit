<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">策划团队共享记忆 LS / MCP 自动化闭环</title>
  <desc id="desc">本地个人知识池、自动化筛选上传、LS 团队事实源、全量同步、本地召回和使用反馈闭环。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3fbf8"/>
      <stop offset="0.55" stop-color="#eef8ff"/>
      <stop offset="1" stop-color="#fffaf0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f3a4a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#0b73b7"/>
    </marker>
    <marker id="arrowOrange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#f19b38"/>
    </marker>
    <style>
      .title { font: 700 45px "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif; fill: #10233f; letter-spacing: 0; }
      .subtitle { font: 500 20px "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif; fill: #3e5d6b; }
      .label { font: 700 21px "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif; fill: #103241; }
      .body { font: 500 17px "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif; fill: #42616e; }
      .small { font: 500 14px "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif; fill: #5b727b; }
      .num { font: 800 18px Arial, sans-serif; fill: #ffffff; }
      .card { fill: #ffffff; stroke: #b7dad6; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .guard { fill: #ffffff; stroke: #20a892; stroke-width: 2; rx: 16; }
      .chip { fill: #e7f7f3; stroke: #88cfc4; stroke-width: 1.5; rx: 14; }
      .line { stroke: #0b73b7; stroke-width: 6; fill: none; marker-end: url(#arrowBlue); stroke-linecap: round; }
      .feedback { stroke: #f19b38; stroke-width: 5; fill: none; marker-end: url(#arrowOrange); stroke-dasharray: 10 8; stroke-linecap: round; }
      .teal { fill: #009b8f; }
      .blue { fill: #0b73b7; }
      .orange { fill: #f19b38; }
      .dark { fill: #10233f; }
      .warn { fill: #fff7e8; stroke: #f2b35d; stroke-width: 1.5; rx: 12; }
    </style>
  </defs>

  <rect width="1500" height="900" fill="url(#bg)"/>

  <text x="750" y="62" text-anchor="middle" class="title">策划团队共享记忆 LS / MCP 自动化闭环</text>
  <text x="750" y="98" text-anchor="middle" class="subtitle">本地默认个人知识池，自动化筛选上传候选；LS 是团队事实源，本地全量同步后供 AI 使用</text>

  <rect x="95" y="124" width="1310" height="72" class="guard"/>
  <g transform="translate(128 142)">
    <circle cx="26" cy="18" r="18" class="dark"/>
    <path d="M17 18h18M26 9v18" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="186" y="156" class="label">Git 工具包地址</text>
  <text x="186" y="184" class="body">github.com/karlcptbtptp/planner-memory-kit</text>
  <text x="890" y="170" class="small">本仓只放接入规范、模板、流程图和自动化任务说明，不放真实知识库本体</text>

  <g transform="translate(62 250)">
    <rect width="190" height="222" class="card"/>
    <circle cx="28" cy="30" r="18" class="teal"/>
    <text x="28" y="36" text-anchor="middle" class="num">1</text>
    <text x="96" y="38" text-anchor="middle" class="label">本地工作产出</text>
    <rect x="58" y="76" width="78" height="58" class="chip"/>
    <path d="M75 94h44M75 111h44M75 128h28" stroke="#009b8f" stroke-width="5" stroke-linecap="round"/>
    <text x="96" y="164" text-anchor="middle" class="body">对话 / 分析 / 排障</text>
    <text x="96" y="191" text-anchor="middle" class="small">先沉淀为本地经验</text>
  </g>

  <path d="M267 360H317" class="line"/>

  <g transform="translate(330 250)">
    <rect width="205" height="222" class="card"/>
    <circle cx="28" cy="30" r="18" class="teal"/>
    <text x="28" y="36" text-anchor="middle" class="num">2</text>
    <text x="104" y="38" text-anchor="middle" class="label">个人知识池</text>
    <ellipse cx="102" cy="92" rx="48" ry="17" fill="#e7f7f3" stroke="#0b73b7" stroke-width="4"/>
    <rect x="54" y="92" width="96" height="46" fill="#e7f7f3" stroke="#0b73b7" stroke-width="4"/>
    <ellipse cx="102" cy="138" rx="48" ry="17" fill="#e7f7f3" stroke="#0b73b7" stroke-width="4"/>
    <text x="104" y="170" text-anchor="middle" class="body">默认不上传团队</text>
    <text x="104" y="196" text-anchor="middle" class="small">personal / local candidates</text>
  </g>

  <path d="M550 360H600" class="line"/>

  <g transform="translate(612 235)">
    <rect width="245" height="252" class="card"/>
    <circle cx="30" cy="32" r="18" class="orange"/>
    <text x="30" y="38" text-anchor="middle" class="num">3</text>
    <text x="124" y="40" text-anchor="middle" class="label">本地自动化治理</text>
    <rect x="34" y="74" width="178" height="36" class="chip"/>
    <text x="123" y="98" text-anchor="middle" class="body">memory:ls:maintain</text>
    <text x="123" y="136" text-anchor="middle" class="body">筛选 / 脱敏 / 去重</text>
    <text x="123" y="163" text-anchor="middle" class="body">跳过 do_not_upload</text>
    <text x="123" y="190" text-anchor="middle" class="body">冲突与旧版识别</text>
    <text x="123" y="218" text-anchor="middle" class="small">只上传候选和反馈</text>
  </g>

  <path d="M872 360H922" class="line"/>

  <g transform="translate(934 250)">
    <rect width="205" height="222" class="card"/>
    <circle cx="28" cy="30" r="18" class="teal"/>
    <text x="28" y="36" text-anchor="middle" class="num">4</text>
    <text x="104" y="38" text-anchor="middle" class="label">LS 审核队列</text>
    <circle cx="102" cy="100" r="40" fill="#e7f7f3" stroke="#20a892" stroke-width="4"/>
    <path d="M79 101l16 16 31-37" stroke="#009b8f" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="104" y="170" text-anchor="middle" class="body">维护人审核</text>
    <text x="104" y="196" text-anchor="middle" class="small">accepted / active only</text>
  </g>

  <path d="M1154 360H1204" class="line"/>

  <g transform="translate(1216 250)">
    <rect width="220" height="222" class="card"/>
    <circle cx="28" cy="30" r="18" class="teal"/>
    <text x="28" y="36" text-anchor="middle" class="num">5</text>
    <text x="112" y="38" text-anchor="middle" class="label">本地团队缓存</text>
    <ellipse cx="82" cy="88" rx="42" ry="16" fill="#e7f7f3" stroke="#0b73b7" stroke-width="4"/>
    <rect x="40" y="88" width="84" height="48" fill="#e7f7f3" stroke="#0b73b7" stroke-width="4"/>
    <ellipse cx="82" cy="136" rx="42" ry="16" fill="#e7f7f3" stroke="#0b73b7" stroke-width="4"/>
    <rect x="136" y="82" width="48" height="58" fill="#fff" stroke="#009b8f" stroke-width="4" rx="4"/>
    <path d="M146 102h24M146 118h18" stroke="#009b8f" stroke-width="4" stroke-linecap="round"/>
    <text x="112" y="170" text-anchor="middle" class="body">全量同步 LS</text>
    <text x="112" y="196" text-anchor="middle" class="small">SQLite + team-memory.md</text>
  </g>

  <g transform="translate(314 585)">
    <rect width="300" height="132" class="card"/>
    <circle cx="34" cy="34" r="20" class="blue"/>
    <path d="M25 34h18M34 25v18" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <text x="76" y="40" class="label">新对话 AI 召回</text>
    <text x="34" y="78" class="body">memory:task start / refresh</text>
    <text x="34" y="105" class="body">search / prefetch / pin</text>
  </g>

  <path d="M1308 490 C1210 620 792 653 632 646" class="line"/>

  <g transform="translate(760 585)">
    <rect width="360" height="132" class="card"/>
    <circle cx="34" cy="34" r="20" class="orange"/>
    <path d="M25 35l8 8 16-22" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="40" class="label">使用与治理反馈</text>
    <text x="34" y="78" class="body">有用 / 无用 / miss / correction</text>
    <text x="34" y="105" class="body">重复 / 矛盾 / 旧版替代 / 召回词缺失</text>
  </g>

  <path d="M935 573 C860 520 780 512 735 498" class="feedback"/>
  <path d="M940 572 C1064 540 1100 498 1100 474" class="feedback"/>

  <rect x="110" y="770" width="1280" height="74" class="guard"/>
  <g transform="translate(140 788)">
    <circle cx="18" cy="18" r="18" class="teal"/>
    <path d="M9 18l7 7 13-18" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="190" y="810" class="label">原则：</text>
  <text x="270" y="810" class="body">本地默认个人知识</text>
  <text x="470" y="810" class="body">敏感和 do_not_upload 不上传</text>
  <text x="760" y="810" class="body">LS 已审核知识全量同步</text>
  <text x="1030" y="810" class="body">使用质量和冲突反馈回传 LS</text>
</svg>
